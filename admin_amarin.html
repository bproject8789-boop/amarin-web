<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin — อมรินทร์</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@700;900&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',sans-serif;background:#1a0505;min-height:100vh;color:#fff}
header{background:linear-gradient(135deg,#8B0000,#5C0000);padding:14px 16px}
.ht{font-family:'Noto Serif Thai',serif;font-size:17px;font-weight:900;color:#FFD700}
.hs{font-size:11px;color:#FFE4B5;opacity:.8;margin-top:2px}
.tabs{display:flex;background:#0d0202;border-bottom:1px solid rgba(255,215,0,.15);overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:12px 18px;font-size:13px;color:rgba(255,215,0,.5);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:'Noto Sans Thai',sans-serif}
.tab.active{color:#FFD700;border-bottom-color:#FFD700}
.panel{display:none;padding:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.15);border-radius:10px;padding:12px}
.sv{font-size:22px;font-weight:700;color:#FFD700}
.sl{font-size:10px;color:rgba(255,215,0,.6);margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:rgba(139,0,0,.5);color:#FFD700;padding:8px;text-align:left;white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid rgba(255,255,255,.04);color:#FFE4B5;vertical-align:top}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.bw{background:#FEF3C7;color:#92400E}.bc{background:#DBEAFE;color:#1E40AF}
.bk{background:#FEF3C7;color:#B45309}.bd{background:#FED7AA;color:#9A3412}
.bs{background:#D1FAE5;color:#065F46}.bx{background:#FEE2E2;color:#991B1B}
input,select,textarea{width:100%;padding:10px;border:1px solid rgba(255,215,0,.2);border-radius:8px;background:rgba(255,255,255,.05);color:#FFE4B5;font-family:'Noto Sans Thai',sans-serif;font-size:12px;margin-bottom:8px}
label{font-size:11px;color:rgba(255,215,0,.7);display:block;margin-bottom:3px;font-weight:600}
select option{background:#1a0505;color:#FFE4B5}
.btn{padding:9px 16px;border:none;border-radius:8px;font-family:'Noto Sans Thai',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.bg{background:#FFD700;color:#5C0000}
.br{background:#8B0000;color:#FFD700}
.bgy{background:rgba(255,255,255,.1);color:#FFE4B5}
.bgn{background:#059669;color:white}
.brd{background:#DC2626;color:white}
.bsm{padding:5px 10px;font-size:11px}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,215,0,.08);border-radius:10px;margin-bottom:8px}
.mimg{width:48px;height:48px;border-radius:8px;background:rgba(255,215,0,.08);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.mname{font-weight:700;color:#FFE4B5;font-size:13px}
.msub{font-size:10px;color:rgba(255,228,181,.6);margin-top:2px}
.mprice{font-size:13px;font-weight:700;color:#FFD700;flex-shrink:0}
.mst{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700;flex-shrink:0}
.open{background:#D1FAE5;color:#065F46}
.closed{background:#FEE2E2;color:#991B1B}
.prow{display:flex;align-items:flex-start;gap:10px;padding:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,215,0,.08);border-radius:10px;margin-bottom:8px}
.tw{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tg{position:relative;width:40px;height:22px;flex-shrink:0}
.tg input{opacity:0;width:0;height:0;position:absolute}
.sl2{position:absolute;inset:0;background:rgba(255,255,255,.2);border-radius:999px;transition:.3s}
.sl2:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:white;border-radius:50%;transition:.3s}
.tg input:checked + .sl2{background:#FFD700}
.tg input:checked + .sl2:before{transform:translateX(18px);background:#5C0000}
.rfbtn{background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.2);color:#FFD700;padding:6px 14px;border-radius:8px;font-family:'Noto Sans Thai',sans-serif;font-size:11px;cursor:pointer;float:right;margin-bottom:10px}
.ox{overflow-x:auto}
.upa{border:2px dashed rgba(255,215,0,.4);border-radius:10px;padding:14px;text-align:center;cursor:pointer;margin-bottom:8px}
.uppr{width:80px;height:80px;border-radius:10px;background:rgba(255,215,0,.08);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
.card2{background:rgba(255,255,255,.05);border:1px solid rgba(255,215,0,.1);border-radius:10px;padding:12px;margin-bottom:10px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:flex-end}
#modal.show{display:flex}
#modal-in{background:#1a0505;border:1px solid rgba(255,215,0,.2);border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:18px}
.te{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#FFD700;color:#5C0000;padding:10px 20px;border-radius:999px;font-size:12px;font-weight:700;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}

#order-alert{display:none;position:fixed;top:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#8B0000,#5C0000);color:#FFD700;padding:14px 28px;border-radius:999px;font-size:15px;font-weight:700;z-index:998;box-shadow:0 4px 20px rgba(139,0,0,.5);transition:opacity .5s;white-space:nowrap;font-family:'Noto Sans Thai',sans-serif}
#sound-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="ht">&#x1F969; Admin &mdash; อมรินทร์ โคตรเนื้อ โคตรกรอบ</div>
  <div class="hs">หลังบ้านจัดการร้าน</div>
</header>
<div class="tabs">
  <div class="tab active" onclick="showTab('orders',this)">&#x1F4CB; ออเดอร์</div>
  <div class="tab" onclick="showTab('menu',this)">&#x1F37D; เมนู</div>
  <div class="tab" onclick="showTab('promo',this)">&#x1F381; โปรโมชั่น</div>
  <div class="tab" onclick="showTab('riders',this)">&#x1F6F5; ไรเดอร์</div>
</div>
<div id="order-alert"></div>
<div id="panel-orders" class="panel">
  <div id="sound-controls">
    <button id="sound-btn" class="btn bg bsm" onclick="toggleSound()">🔔 เสียงแจ้งเตือน: เปิด</button>
    <button class="btn bgy bsm" onclick="testSound()">▶ ทดสอบเสียง</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="sv" id="s-total">0</div><div class="sl">ออเดอร์วันนี้</div></div>
    <div class="stat"><div class="sv" id="s-revenue">฿0</div><div class="sl">ยอดขาย</div></div>
    <div class="stat"><div class="sv" id="s-pending">0</div><div class="sl">รอยืนยัน</div></div>
    <div class="stat"><div class="sv" id="s-delivering">0</div><div class="sl">กำลังส่ง</div></div>
  </div>
  <button class="rfbtn" onclick="loadOrders()">&#x1F504; รีเฟรช</button>
  <div class="ox" id="orders-table"><div style="text-align:center;padding:30px;color:rgba(255,215,0,.4)">กำลังโหลด...</div></div>
</div>
<div id="panel-menu" class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="color:#FFD700;font-weight:700">รายการเมนู</div>
    <button class="btn bg bsm" onclick="openAddMenu()">+ เพิ่มเมนู</button>
  </div>
  <div id="menu-list"><div style="text-align:center;padding:30px;color:rgba(255,215,0,.4)">กำลังโหลด...</div></div>
</div>
<div id="panel-promo" class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="color:#FFD700;font-weight:700">โปรโมชั่น</div>
    <button class="btn bg bsm" onclick="openAddPromo()">+ เพิ่มโปร</button>
  </div>
  <div id="promo-list"><div style="text-align:center;padding:30px;color:rgba(255,215,0,.4)">กำลังโหลด...</div></div>
</div>
<div id="panel-riders" class="panel">
  <div style="color:#FFD700;font-weight:700;margin-bottom:12px">รอบส่งที่กำลังดำเนินการ</div>
  <div id="rider-orders"><div style="text-align:center;padding:30px;color:rgba(255,215,0,.4)">กำลังโหลด...</div></div>
</div>
<div id="modal" onclick="bgClose(event)"><div id="modal-in"></div></div>
<div class="te" id="te"></div>
<script>
var API = 'https://amarin-delivery.onrender.com';
var SB = {'รอยืนยัน':'bw','ยืนยันแล้ว':'bc','รอรอบ':'bc','กำลังทำ':'bk','กำลังส่ง':'bd','ส่งสำเร็จ':'bs','ยกเลิก':'bx'};
var DM = [
  {id:1,name:'เนื้อตุ๋นโคตรนุ่ม',cat:'เนื้อ',price:159,img:'🥩',stock:999,status:'เปิด',signature:true,sortOrder:1},
  {id:2,name:'เนื้อทอดกระเทียมโคตรกรอบ',cat:'เนื้อ',price:139,img:'🍖',stock:999,status:'เปิด',signature:true,sortOrder:2},
  {id:3,name:'สเต็กเนื้อโคตรกรอบ',cat:'เนื้อ',price:199,img:'🥩',stock:999,status:'เปิด',signature:true,sortOrder:3},
  {id:4,name:'หมูทอดกระเทียม',cat:'หมู',price:89,img:'🐷',stock:999,status:'เปิด',signature:false,sortOrder:4},
  {id:5,name:'หมูย่างซีอิ๊ว',cat:'หมู',price:99,img:'🐷',stock:999,status:'เปิด',signature:false,sortOrder:5}
];
var MD = [], PD = [], IB = '';

function showTab(id, el) {
  var ts = document.querySelectorAll('.tab');
  for (var i = 0; i < ts.length; i++) ts[i].classList.remove('active');
  var ids = ['orders','menu','promo','riders'];
  for (var j = 0; j < ids.length; j++) {
    var p = document.getElementById('panel-' + ids[j]);
    if (p) p.style.display = 'none';
  }
  if (el) el.classList.add('active');
  var t = document.getElementById('panel-' + id);
  if (t) t.style.display = 'block';
  if (id === 'orders') loadOrders();
  if (id === 'menu') loadMenu();
  if (id === 'promo') loadPromo();
  if (id === 'riders') loadRiders();
}

// ORDERS
async function loadOrders() {
  var tbl = document.getElementById('orders-table');
  try {
    var r = await fetch(API + '/orders');
    var d = await r.json();
    var os = d.orders || [];
    var st = d.stats || {};
    document.getElementById('s-total').textContent = st.todayCount || os.length;
    document.getElementById('s-revenue').textContent = '฿' + (st.todayRevenue || 0).toLocaleString();
    document.getElementById('s-pending').textContent = st.pending || 0;
    checkNewOrders(os.length, st.pending || 0);
    document.getElementById('s-delivering').textContent = st.delivering || 0;
    if (!os.length) { tbl.innerHTML = '<div style="text-align:center;padding:30px;color:rgba(255,215,0,.4)">ไม่มีออเดอร์</div>'; return; }
    var h = '<table class="tbl"><thead><tr><th>Order ID</th><th>สถานะ</th><th>ลูกค้า</th><th>รายการ</th><th>ยอด</th><th>ชำระ</th></tr></thead><tbody>';
    for (var i = 0; i < os.length; i++) {
      var o = os[i];
      h += '<tr><td style="white-space:nowrap">' + o.orderId + '</td>';
      h += '<td><span class="badge ' + (SB[o.status] || '') + '">' + o.status + '</span></td>';
      h += '<td>' + (o.name || '') + '<br><span style="opacity:.6">' + (o.phone || '') + '</span></td>';
      h += '<td style="max-width:140px">' + (o.itemsSummary || o.items || '') + '</td>';
      h += '<td style="color:#FFD700">฿' + (o.total || 0) + '</td>';
      h += '<td>' + (o.payMethod || '') + '</td></tr>';
    }
    tbl.innerHTML = '<div class="ox">' + h + '</tbody></table></div>';
  } catch(e) {
    tbl.innerHTML = '<div style="color:#FCA5A5;padding:20px;font-size:12px">เชื่อมต่อ API ไม่ได้<br>กด รีเฟรช เพื่อลองใหม่</div>';
    document.getElementById('s-total').textContent = '-';
    document.getElementById('s-revenue').textContent = '-';
    document.getElementById('s-pending').textContent = '-';
    document.getElementById('s-delivering').textContent = '-';
  }
}

// MENU
function svML() { localStorage.setItem('admin_menu', JSON.stringify(MD)); }
function ldML() { var s = localStorage.getItem('admin_menu'); if (s) { try { MD = JSON.parse(s); return true; } catch(e) {} } return false; }

async function loadMenu() {
  if (!ldML()) MD = DM.map(function(m) { return Object.assign({}, m); });
  try {
    var r = await fetch(API + '/menu/all');
    var d = await r.json();
    if (d.ok && d.menu && d.menu.length) { MD = d.menu; svML(); }
  } catch(e) {}
  renderML();
}

function gImg(img) {
  if (!img) return '🍽️';
  if (img.startsWith('data:image')) return '<img src="' + img + '" style="width:46px;height:46px;object-fit:cover;border-radius:8px">';
  if (img.startsWith('menu_img_')) {
    var imgs = JSON.parse(localStorage.getItem('menu_images') || '{}');
    var k = img.replace('menu_img_', '');
    if (imgs[k]) return '<img src="' + imgs[k] + '" style="width:46px;height:46px;object-fit:cover;border-radius:8px">';
  }
  return '<span style="font-size:26px">' + img + '</span>';
}

function renderML() {
  var el = document.getElementById('menu-list');
  if (!MD.length) { el.innerHTML = '<div style="text-align:center;padding:30px;color:rgba(255,215,0,.4)">ยังไม่มีเมนู กด "+ เพิ่มเมนู"</div>'; return; }
  var h = '';
  MD.forEach(function(m) {
    var op = m.status !== 'ปิด';
    h += '<div class="mrow">';
    h += '<div class="mimg">' + gImg(m.img) + '</div>';
    h += '<div style="flex:1;min-width:0"><div class="mname">' + m.name + '</div><div class="msub">' + m.cat + '</div></div>';
    h += '<div class="mprice">฿' + m.price + '</div>';
    h += '<span class="mst ' + (op ? 'open' : 'closed') + '">' + (op ? 'เปิด' : 'ปิด') + '</span>';
    h += '<button class="btn bgy bsm" onclick="editMenu(' + m.id + ')">แก้</button>';
    h += '<button class="btn bsm brd" style="margin-left:4px" onclick="delMenu(' + m.id + ')">ลบ</button>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function delMenu(id) {
  if (!confirm('ลบเมนูนี้?')) return;
  MD = MD.filter(function(m) { return m.id !== id; });
  svML();
  fetch(API + '/menu/' + id, { method: 'DELETE' }).catch(function() {});
  renderML(); toast('ลบเมนูแล้ว');
}

function togSt(id, st) {
  var m = MD.find(function(x) { return x.id === id; });
  if (!m) return;
  m.status = st; svML();
  fetch(API + '/menu/' + id + '/status', { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({status: st}) }).catch(function() {});
  closeModal(); renderML();
  toast((st === 'เปิด' ? '✅ เปิด' : '❌ ปิด') + ': ' + m.name);
}

function openAddMenu() {
  IB = '';
  var h = '<div style="color:#FFD700;font-family:\'Noto Serif Thai\',serif;font-size:15px;font-weight:700;margin-bottom:12px">+ เพิ่มเมนูใหม่</div>';
  h += '<input type="hidden" id="m-id" value="">';
  h += '<label>ชื่อเมนู *</label><input type="text" id="m-name" placeholder="ชื่อเมนู">';
  h += '<label>หมวดหมู่ *</label>';
  h += '<select id="m-cat"><option value="เนื้อ">🥩 เนื้อ</option><option value="หมู">🐷 หมู</option></select>';
  h += '<label>ราคา (บาท) *</label><input type="number" id="m-price" placeholder="150">';
  h += '<label>รูปเมนู * (กดเพื่ออัปโหลด)</label>';
  h += '<div class="upa" onclick="document.getElementById(\'m-img-file\').click()">';
  h += '<div class="uppr" id="img-preview">📷</div>';
  h += '<div style="font-size:11px;color:rgba(255,215,0,.6)">กดเพื่ออัปโหลด JPG/PNG</div></div>';
  h += '<input type="file" id="m-img-file" accept="image/*" style="display:none" onchange="hdlImg(this)">';
  h += '<label>คำบรรยาย</label><textarea id="m-desc" placeholder="บรรยายสั้นๆ"></textarea>';
  h += '<label>ลำดับการแสดง</label><input type="number" id="m-sort" placeholder="1,2,3...">';
  h += '<div class="tw"><label class="tg"><input type="checkbox" id="m-sig"><span class="sl2"></span></label>';
  h += '<span style="font-size:12px;color:#FFE4B5">เมนูแนะนำ (ดาวทอง)</span></div>';
  h += '<div class="brow"><button class="btn bg" onclick="saveMenu()">บันทึก</button>';
  h += '<button class="btn bgy" onclick="closeModal()">ยกเลิก</button></div>';
  showModal(h);
}

function editMenu(id) {
  var m = MD.find(function(x) { return x.id === id; });
  if (!m) return;
  IB = '';
  var h = '<div style="color:#FFD700;font-family:\'Noto Serif Thai\',serif;font-size:15px;font-weight:700;margin-bottom:12px">✏️ แก้ไข: ' + m.name + '</div>';
  h += '<input type="hidden" id="m-id" value="' + m.id + '">';
  h += '<label>ชื่อเมนู</label><input type="text" id="m-name" value="' + m.name + '">';
  h += '<label>หมวดหมู่</label><select id="m-cat">';
  h += '<option value="เนื้อ"' + (m.cat === 'เนื้อ' ? ' selected' : '') + '>🥩 เนื้อ</option>';
  h += '<option value="หมู"' + (m.cat === 'หมู' ? ' selected' : '') + '>🐷 หมู</option></select>';
  h += '<label>ราคา (บาท)</label><input type="number" id="m-price" value="' + m.price + '">';
  h += '<label>รูปเมนู (กดเพื่อเปลี่ยน)</label>';
  h += '<div class="upa" onclick="document.getElementById(\'m-img-file\').click()">';
  h += '<div class="uppr" id="img-preview">' + gImg(m.img) + '</div>';
  h += '<div style="font-size:11px;color:rgba(255,215,0,.6)">กดเพื่อเปลี่ยนรูป</div></div>';
  h += '<input type="file" id="m-img-file" accept="image/*" style="display:none" onchange="hdlImg(this)">';
  h += '<label>คำบรรยาย</label><textarea id="m-desc">' + (m.desc || '') + '</textarea>';
  h += '<label>ลำดับการแสดง</label><input type="number" id="m-sort" value="' + (m.sortOrder || 99) + '">';
  h += '<div style="display:flex;gap:8px;margin:8px 0">';
  h += '<button class="btn bgn" style="flex:1" onclick="togSt(' + id + ',\'เปิด\')">✅ เปิดเมนู</button>';
  h += '<button class="btn br" style="flex:1" onclick="togSt(' + id + ',\'ปิด\')">❌ ปิดเมนู</button></div>';
  h += '<div class="tw"><label class="tg"><input type="checkbox" id="m-sig"' + (m.signature ? ' checked' : '') + '>';
  h += '<span class="sl2"></span></label>';
  h += '<span style="font-size:12px;color:#FFE4B5">เมนูแนะนำ (ดาวทอง)</span></div>';
  h += '<div class="brow"><button class="btn bg" onclick="saveMenu()">บันทึก</button>';
  h += '<button class="btn bgy" onclick="closeModal()">ยกเลิก</button></div>';
  showModal(h);
}

function saveMenu() {
  var name = (document.getElementById('m-name').value || '').trim();
  var price = document.getElementById('m-price').value;
  if (!name) return toast('กรุณาใส่ชื่อเมนู');
  if (!price) return toast('กรุณาใส่ราคา');
  var eid = parseInt(document.getElementById('m-id').value || '0');
  var isEdit = MD.some(function(m) { return m.id === eid; });
  var isB64 = IB.startsWith('data:image');
  if (!isB64 && !isEdit) return toast('กรุณาอัปโหลดรูปเมนูก่อน');
  var nid = eid || (Date.now() % 100000);
  if (isB64) {
    var imgs = JSON.parse(localStorage.getItem('menu_images') || '{}');
    imgs[String(nid)] = IB;
    localStorage.setItem('menu_images', JSON.stringify(imgs));
  }
  var ex = MD.find(function(m) { return m.id === nid; });
  var imgK = isB64 ? ('menu_img_' + nid) : (ex ? ex.img : '🍽️');
  var ni = {
    id: nid, name: name,
    cat: document.getElementById('m-cat').value || 'เนื้อ',
    price: parseInt(price), img: imgK,
    desc: (document.getElementById('m-desc').value || '').trim(),
    stock: 999, status: ex ? ex.status : 'เปิด',
    signature: document.getElementById('m-sig').checked,
    sortOrder: parseInt(document.getElementById('m-sort').value || '99')
  };
  var idx = MD.findIndex(function(m) { return m.id === nid; });
  if (idx >= 0) { MD[idx] = ni; toast('แก้ไขเมนูแล้ว ✅'); }
  else { MD.push(ni); toast('เพิ่มเมนูแล้ว ✅'); }
  svML();
  fetch(API + '/menu', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(ni) })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok && isB64) {
        return fetch(API + '/menu/upload-image', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({id: nid, imageBase64: IB}) });
      }
    }).catch(function() {});
  closeModal(); renderML();
}

async function hdlImg(input) {
  var file = input.files[0]; if (!file) return;
  var b64 = await cmpImg(file, 400, 400, 0.75); IB = b64;
  var pr = document.getElementById('img-preview');
  if (pr) pr.innerHTML = '<img src="' + b64 + '" style="width:80px;height:80px;object-fit:cover;border-radius:10px">';
  toast('บีบรูปสำเร็จ ~' + Math.round(b64.length * 0.75 / 1024) + ' KB ✅');
}

function cmpImg(file, mw, mh, q) {
  return new Promise(function(res) {
    var rd = new FileReader();
    rd.onload = function(e) {
      var im = new Image();
      im.onload = function() {
        var w = im.width, h = im.height;
        if (w > mw || h > mh) { var r = Math.min(mw/w, mh/h); w = Math.round(w*r); h = Math.round(h*r); }
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', q));
      };
      im.src = e.target.result;
    };
    rd.readAsDataURL(file);
  });
}

function showModal(h) { document.getElementById('modal-in').innerHTML = h; document.getElementById('modal').classList.add('show'); }

// TOAST
var tt;
function toast(msg) {
  var el = document.getElementById('te');
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(tt); tt = setTimeout(function() { el.style.opacity = '0'; }, 2500);

// ── SOUND NOTIFICATION ──
var lastOrderCount = 0;
var soundEnabled = true;
var speechReady = false;

function initSound() {
  // test ว่า browser รองรับ speech synthesis
  if ('speechSynthesis' in window) {
    speechReady = true;
    // โหลด voices ให้พร้อม
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function() {
      window.speechSynthesis.getVoices();
    };
  }
}

function speakOrder(count) {
  if (!soundEnabled || !speechReady) return;
  window.speechSynthesis.cancel(); // หยุดเสียงก่อนหน้า

  var msg = new SpeechSynthesisUtterance();
  msg.text = 'มีออเดอร์เข้ามาแล้วค่ะ ร้านอมรินทร์ โคตรเนื้อ โคตรกรอบ';
  msg.lang = 'th-TH';
  msg.volume = 1.0;   // เสียงดังสุด
  msg.rate = 0.85;    // ช้าลงนิด ฟังชัด
  msg.pitch = 1.4;    // เสียงสูง — ผู้หญิง

  // หาเสียงผู้หญิงภาษาไทย
  var voices = window.speechSynthesis.getVoices();
  var thVoice = null;
  for (var i = 0; i < voices.length; i++) {
    var v = voices[i];
    if (v.lang === 'th-TH' || v.lang === 'th') {
      // เลือกเสียงผู้หญิง
      if (v.name.toLowerCase().includes('female') ||
          v.name.toLowerCase().includes('woman') ||
          v.name.includes('Kanya') ||
          v.name.includes('Narisa') ||
          !thVoice) {
        thVoice = v;
      }
    }
  }
  if (thVoice) msg.voice = thVoice;

  // พูด 2 ครั้ง ให้ได้ยินชัด
  window.speechSynthesis.speak(msg);
  setTimeout(function() {
    var msg2 = new SpeechSynthesisUtterance();
    msg2.text = 'มีออเดอร์ใหม่ ' + count + ' รายการ รีบรับเลยค่ะ';
    msg2.lang = 'th-TH';
    msg2.volume = 1.0;
    msg2.rate = 0.85;
    msg2.pitch = 1.4;
    if (thVoice) msg2.voice = thVoice;
    window.speechSynthesis.speak(msg2);
  }, 2500);
}

function checkNewOrders(newCount, newPending) {
  if (newPending > lastOrderCount && lastOrderCount >= 0) {
    speakOrder(newPending);
    // แสดง notification popup ด้วย
    showOrderAlert(newPending);
  }
  lastOrderCount = newPending;
}

function showOrderAlert(count) {
  var el = document.getElementById('order-alert');
  if (!el) return;
  el.innerHTML = '🔔 มีออเดอร์ใหม่ ' + count + ' รายการ!';
  el.style.display = 'block';
  el.style.opacity = '1';
  setTimeout(function() {
    el.style.opacity = '0';
    setTimeout(function() { el.style.display = 'none'; }, 500);
  }, 4000);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  var btn = document.getElementById('sound-btn');
  if (btn) btn.textContent = soundEnabled ? '🔔 เสียงแจ้งเตือน: เปิด' : '🔕 เสียงแจ้งเตือน: ปิด';
  toast(soundEnabled ? 'เปิดเสียงแจ้งเตือนแล้ว' : 'ปิดเสียงแจ้งเตือนแล้ว');
}

function testSound() {
  speakOrder(1);
}
